<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>えんぴつマスター3D</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
}

canvas{
    display:block;
}

#info{
    position:fixed;
    top:10px;
    left:10px;
    z-index:100;
    background:white;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
}

#pad{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    text-align:center;
}

#pad button{
    width:80px;
    height:80px;
    margin:5px;
    font-size:30px;
    border:none;
    border-radius:15px;
    background:white;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
}
</style>

</head>
<body>

<div id="info">
🏫 校舎を目指そう
</div>

<div id="pad">
    <button onclick="forward()">⬆️</button>
    <br>
    <button onclick="left()">⬅️</button>
    <button onclick="right()">➡️</button>
    <br>
    <button onclick="back()">⬇️</button>
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.170.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth / window.innerHeight,
0.1,
1000
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const ambient =
new THREE.AmbientLight(
0xffffff,
2
);

scene.add(ambient);

const sun =
new THREE.DirectionalLight(
0xffffff,
3
);

sun.position.set(
10,
10,
10
);

scene.add(sun);

const floor =
new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({
color:0x55aa55
})
);

floor.rotation.x = -Math.PI / 2;

scene.add(floor);

const school =
new THREE.Mesh(
new THREE.BoxGeometry(
6,
4,
6
),
new THREE.MeshStandardMaterial({
color:0xffcc55
})
);

school.position.set(
0,
2,
0
);

scene.add(school);

const door =
new THREE.Mesh(
new THREE.BoxGeometry(
1.5,
2,
0.2
),
new THREE.MeshStandardMaterial({
color:0x663300
})
);

door.position.set(
0,
1,
3.1
);

scene.add(door);

const classroom =
new THREE.Mesh(
new THREE.BoxGeometry(
12,
4,
12
),
new THREE.MeshStandardMaterial({
color:0xaad4ff
})
);

classroom.position.set(
0,
2,
-30
);

classroom.visible = false;

scene.add(classroom);

const teacherDesk =
new THREE.Mesh(
new THREE.BoxGeometry(
2,
1,
1
),
new THREE.MeshStandardMaterial({
color:0x8b4513
})
);

teacherDesk.position.set(
0,
0.5,
-28
);

teacherDesk.visible = false;

scene.add(teacherDesk);

const player = {
x:0,
z:12,
rotation:0
};

let insideSchool = false;

window.forward = function(){

player.x += Math.sin(
player.rotation
);

player.z -= Math.cos(
player.rotation
);

}

window.back = function(){

player.x -= Math.sin(
player.rotation
);

player.z += Math.cos(
player.rotation
);

}

window.left = function(){

player.rotation += 0.15;

}

window.right = function(){

player.rotation -= 0.15;

}

function animate(){

requestAnimationFrame(
animate
);

camera.position.set(
player.x,
2,
player.z
);

camera.lookAt(
player.x +
Math.sin(player.rotation),

2,

player.z -
Math.cos(player.rotation)
);

const distance =
Math.sqrt(
player.x * player.x +
player.z * player.z
);

if(
distance < 4 &&
!insideSchool
){

insideSchool = true;

player.x = 0;
player.z = -22;
player.rotation = Math.PI;

school.visible = false;
door.visible = false;

classroom.visible = true;
teacherDesk.visible = true;

document.getElementById(
"info"
).innerHTML =
"🏫 教室に入った！";
}

if(insideSchool){

document.getElementById(
"info"
).innerHTML =
"🏫 教室探索中";
}

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
